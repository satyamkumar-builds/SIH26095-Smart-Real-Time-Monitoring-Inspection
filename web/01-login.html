<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Sign in | Inspection Monitoring
  </title>
  <link href="18-style.css" rel="stylesheet"/>
  <script defer="" src="19-site.js">
  </script>
 </head>
 <body class="login-page">
  <div class="login-wrap">
   <section class="login-card">
    <div class="login-brand">
     <div class="identity-mark">
      GOI
     </div>
     <div>
      <strong>
       Government of India
      </strong>
      <span>
       Inspection Monitoring Portal
      </span>
     </div>
    </div>
    <div class="login-copy">
     <p class="page-label">
      AUTHORISED ACCESS
     </p>
     <h1>
      Sign in
     </h1>
     <p>
      Use an authorised portal account to access the inspection monitoring workspace.
     </p>
    </div>
    <form class="form-stack" id="loginForm">
     <label for="username">
      Username or email
     </label>
     <input autocomplete="username" id="username" name="username" required="" type="text"/>
     <label for="password">
      Password
     </label>
     <input autocomplete="current-password" id="password" name="password" required="" type="password"/>
     <div class="form-inline">
      <label class="check-label">
       <input type="checkbox"/>
       Keep me signed in
      </label>
      <a href="17-support.html">
       Need help?
      </a>
     </div>
     <button class="primary-button" type="submit">
      Sign in
     </button>
    </form>
    <p class="login-note">
     For authorised departmental use. Authentication and access controls should be connected to the production identity service.
    </p>
   </section>
  </div>
 </body>
</html>
